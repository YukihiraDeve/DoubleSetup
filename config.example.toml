# SetupDouble – configuration. Le même modèle sert aux deux machines.
# Tout se règle aussi depuis la fenêtre SetupDouble → ⚙ Réglages.

# Clé partagée : IDENTIQUE sur les deux machines (12 caractères minimum).
# L'installation en génère une automatiquement.
secret = "change-me"

# Rôle de cette machine, choisi à l'installation :
#   "server" = clavier, souris et carte son sont branchés ici
#   "client" = machine pilotée à distance
role = "server"

log_level = "INFO"   # DEBUG pour tout voir

[server]   # ----- la machine où sont branchés clavier, souris et carte son
bind = "0.0.0.0"
control_port = 47801          # TCP
audio_port = 47802            # UDP (son de la machine pilotée)
beacon = true                 # annonce le serveur sur le réseau (découverte automatique)

# Raccourcis : ctrl, alt, shift, win (= ⌘ sur Mac) + une touche
# (lettre, chiffre, f1..f24, space, left/right/up/down, home, end, pageup,
# pagedown, insert, delete, scrolllock, pause, numpad0..9).
hotkey_toggle = "ctrl+alt+space"   # bascule d'une machine à l'autre
hotkey_remote = ""                  # facultatif : aller directement sur la machine pilotée
hotkey_local = ""                   # facultatif : revenir directement ici

clipboard = true              # partage du texte copié au moment de la bascule
name = ""                     # nom affiché (défaut : nom de l'ordinateur)
ui_port = 47810               # fenêtre de statut (locale uniquement), 0 = désactivée
wake_on_lan = true            # si la machine pilotée dort, le raccourci la réveille
modifier_layout = "pc"        # serveur Mac : ⌘ envoyée comme Ctrl ("pc") ou Windows ("mac")

[client]   # ----- la machine pilotée
server = ""                   # IP du serveur ; vide = découverte automatique
control_port = 47801
audio_port = 47803            # UDP (micro reçu)

# Mac piloté : "pc"  = Ctrl → ⌘ (Ctrl+C copie comme sur Windows), Windows → Ctrl
#              "mac" = Windows → ⌘, Ctrl → Ctrl (disposition Apple)
modifier_layout = "pc"
swap_iso_keys = false         # true si les touches ² et < sont inversées
mouse_speed = 1.0             # multiplicateur de vitesse du curseur
scroll_speed = 3.0            # lignes par cran de molette
invert_scroll = false
clipboard = true
name = ""
ui_port = 47811               # fenêtre de statut (locale uniquement), 0 = désactivée
# Tant que le serveur est connecté, la machine ne s'endort pas (seul l'écran
# s'éteint) : le raccourci la rallume tout de suite.
#   "power" = seulement sur secteur, "always" = aussi sur batterie, "never" = jamais
prevent_sleep = "power"

[audio]
enabled = true
sample_rate = 48000
block_ms = 5                  # taille des paquets
latency_ms = 30               # tampon : monte à 50-80 si ça craque en Wi-Fi
sound = true                  # le son de la machine pilotée sort dans le casque du serveur
mic = true                    # le micro du serveur est disponible sur la machine pilotée
sound_mode = "mix"            # "mix" : les deux sons en même temps ; "follow" : seulement si pilotée
mic_mode = "always"           # "always" : micro partagé en permanence ; "follow" : seulement si pilotée

# Pistes du serveur (une partie du nom suffit ; "" = périphérique par défaut ;
# « | » sépare plusieurs essais, ex. "Scarlett|Focusrite")
server_output_device = ""     # casque
server_input_device = ""      # micro
# server_hostapi = "WASAPI"   # Windows (valeur par défaut) ; ailleurs : vide
mic_channel = 1               # entrée de la carte son où est branché le micro (1 ou 2)
sound_gain = 1.0
mic_gain = 1.0

# Pistes de la machine pilotée ("" = désactivé). Sans ligne ici, valeurs par défaut :
#   macOS   : capture "BlackHole 2ch", micro "BlackHole 16ch" (installés automatiquement)
#   Windows : micro "CABLE Input" (VB-CABLE) ; capture : désactivée (2e câble virtuel)
#   Linux   : désactivés (choisis tes périphériques PipeWire/PulseAudio)
# client_capture_device = "BlackHole 2ch"
# client_mic_device = "BlackHole 16ch"
client_auto_route = true      # macOS : bascule l'entrée/sortie par défaut sur BlackHole
